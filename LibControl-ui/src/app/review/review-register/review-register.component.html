<div class="container">
  <form #f="ngForm" autocomplete="off" (ngSubmit)="save()">

    <div class="p-grid">
      <div class="p-col-12 title">
        <h1>{{ editing ? 'Edição de' : 'Nova' }} Review</h1>
      </div>

      <div class="p-col-12 p-md-6 my-2 p-fluid">
        <label class="calendar">Data</label>
        <p-datepicker [style]="{'width':'100%'}" [inputStyle]="{'width':'100%'}" dateFormat="dd/mm/yy"
        [(ngModel)]="review.date" name="date" #date="ngModel" required></p-datepicker>
        <app-message [control]="date" error="required" text="Informe uma data"></app-message>
      </div>

      <div class="p-col-12 p-md-9 my-2 p-fluid">
        <label for="book">Livro</label>
        <select
          id="book"
          class="p-inputtext p-component"
          [(ngModel)]="review.book.id"
          name="book"
          [disabled]="loadingBooks || books.length === 0"
          style="width: 100%">
          <option [ngValue]="null" disabled>Selecione um livro</option>
          <option *ngFor="let book of books" [ngValue]="book.id">
            {{ book.name }}
          </option>
        </select>
        <small *ngIf="loadingBooks">Carregando livros...</small>
        <small *ngIf="booksError" class="p-error">{{ booksError }}</small>
        <small *ngIf="!loadingBooks && !booksError && books.length === 0">
          Nenhum livro cadastrado.
        </small>
      </div>
      <div class="p-col-12 p-md-9 my-2 p-fluid">
        <label>Nota</label>
        <input pInputText type="number" step="0.5" min="0" max="5" [(ngModel)]="review.rate" name="rate" #rate="ngModel" required>
        <app-message [control]="rate" error="required" text="Informe uma nota (0-5)"></app-message>
      </div>
      <div class="p-col-12">
      	<p>
	        <button pButton class="my-2" type="submit" label="Salvar" [disabled]="f.invalid"></button>
          <button pButton type="button" label="Nova" class="p-button-info"
            (click)="new(f)"></button>
        </p>
      </div>
      <div class="p-col-12">
	        <a routerLink="/reviews">Voltar para a pesquisa</a>
      </div>
    </div>

  </form>
</div>
