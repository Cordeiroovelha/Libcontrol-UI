<div class="container">
  
  <div class="p-col-12">
    <h1>Reviews</h1>
  </div>

  <div class="p-grid">
    <div class="p-col-12">
      <p-table [value]="Reviews" responsiveLayout="stack" [breakpoint]="'768px'">
        <ng-template pTemplate="header">
          <tr>
            <th>Id</th>
            <th>Nome</th>
            <th>Data da Review</th>
            <th>Nota Pessoal</th>
            <th class="col-actions-header"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-Reviews>
          <tr>
            <td>{{ Reviews.id }}</td>
            <td>{{ Reviews.user.name }}</td>
            <td>{{ Reviews.date }}</td>
            <td>{{ Reviews.rate }}</td>
            <td class="col-actions">
                <a pButton icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top"></a>
                <button pButton icon="pi pi-trash" pTooltip="Excluir" tooltipPosition="top"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
    <div class="p-col-12">
      <p><a pButton label="Nova Review"></a></p>
    </div>
  </div>
</div>
