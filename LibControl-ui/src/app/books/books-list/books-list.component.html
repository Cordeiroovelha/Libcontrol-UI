<main class="books-page">
  <div class="books-heading">
    <h1>Livros</h1>
    <a pButton label="Novo Livro" class="btn btn-success" routerLink="/books/new"></a>
  </div>

  <section class="books-grid" aria-label="Capas dos livros">
    <article class="book-card" *ngFor="let livro of Livros" tabindex="0">
      <img
        [src]="coverUrl(livro.cover)"
        [alt]="'Capa do livro ' + livro.name"
        loading="lazy"
      >
      <div class="book-info">
        <h2>{{ livro.name }}</h2>
        <p>Nota da crítica: <strong>{{ livro.rated }}</strong></p>
      </div>
    </article>
  </section>
</main>
