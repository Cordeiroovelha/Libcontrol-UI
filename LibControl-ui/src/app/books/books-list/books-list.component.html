<div class="container">
  
  <div class="p-col-12">
    <h1>Livros</h1>
  </div>

  <div class="p-grid">
    <div class="p-col-12">
      <p-table [value]="Livros" responsiveLayout="stack" [breakpoint]="'768px'">
        <ng-template pTemplate="header">
          <tr>
            <th>Id</th>
            <th>Nome</th>
            <th>Data de Lançamento</th>
            <th>Categoria</th>
            <th>Disponivel para alugar</th>
            <th class="col-actions-header"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-livros>
          <tr>
            <td>{{ livros.id }}</td>
            <td>{{ livros.name }}</td>
            <td>{{ livros.release_date }}</td>
            <td>{{ livros.category }}</td>
            <td>{{ livros.booked }}</td>
            <td class="col-actions">
                <a pButton icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top"></a>
                <button pButton icon="pi pi-trash" pTooltip="Excluir" tooltipPosition="top"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
    <div class="p-col-12">
      <p><a pButton label="Novo Livro"></a></p>
    </div>
  </div>
</div>
