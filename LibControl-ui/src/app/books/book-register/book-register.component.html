<div class="container">
  <form>

    <div class="p-grid">
      <div class="p-col-12 title">
        <h1>Nova Leitura</h1>
      </div>

      <div class="p-col-12 p-md-9 my-2 p-fluid">
        <label>Nome do livro</label>
        <input pInputText type="Text">
      </div>

      <div class="p-col-12 p-md-6 my-2 p-fluid">
        <label>Tipo</label>
        <p-select [options]="types" placeholder="Selecione"></p-select>
      </div>

      <div class="p-col-12 p-md-6 my-2 p-fluid">
        <label class="calendar">Data de lançamento</label>
        <p-datepicker [style]="{'width':'100%'}" [inputStyle]="{'width':'100%'}" dateFormat="dd/mm/yy"></p-datepicker>
      </div>

      <div class="p-col-12 p-md-9 my-2 p-fluid">
        <label>Nota da Crítica</label>
        <input pInputText type="number" step="0.5" min="0" max="5">
      </div>
      <div class="p-col-12">
      	<p>
	        <button pButton class="my-2" type="submit" label="Salvar"></button>
	        <button pButton class="my-2" type="button" label="Nova" class="p-button-info"></button>
        </p>
      </div>
      <div class="p-col-12">
	        <a class="my-2" href="javascript:;">Voltar para a pesquisa</a>
      </div>
    </div>

  </form>
</div>
